<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg-main);color:var(--text-primary);font:13px Inter,-apple-system,system-ui,sans-serif}
body{display:grid;grid-template-rows:44px minmax(0,1fr);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--bg-secondary);border-bottom:1px solid var(--separator)}
.brand{font:600 12px var(--mono);letter-spacing:.14em;margin-right:6px;white-space:nowrap}.brand b{color:var(--accent)}
.chip{font:11px var(--mono);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.row{display:flex;align-items:center;gap:2px;padding:0 4px 0 12px;height:34px;border-left:2px solid transparent;color:var(--text-secondary)}
.row.on{background:var(--accent-overlay);border-left-color:var(--accent);color:var(--text-primary)}
.fn{flex:1;font:12px/34px var(--mono);overflow:hidden;text-overflow:ellipsis}
.mini{height:26px;min-width:26px;padding:0;border-color:transparent;background:none}
#foot{padding:8px;border-top:1px solid var(--separator)}

.tab{height:30px;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;font:12px var(--mono);white-space:nowrap}

#pf{width:100%;height:100%;border:0;background:#fff}

body.side aside{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
main[data-view=code] #out,main[data-view=out] #ed{display:none}}
@media(min-width:901px){#menu,#view{display:none}}

:root{--bg-main:#08090C;--bg-secondary:#0D0F13;--bg-sidebar:#0A0B0E;--bg-panel:#101217;--bg-elevated:#151820;--accent:#C8102E;--accent-bright:#F0284F;--accent-overlay:rgba(240,40,79,.12);--text-primary:#E8E9ED;--text-secondary:#9296A1;--text-muted:#606571;--border:#252831;--separator:#1B1E25;--error:#FF6B81;--silver:#C9CCD6}
header{background:linear-gradient(#12141A,#0D0F13);box-shadow:0 1px 0 rgba(255,255,255,.05)}
.brand{font:700 16px Inter,system-ui,sans-serif;letter-spacing:-.02em}.brand b{color:var(--accent-bright)}
button{border-radius:7px}button:hover{border-color:#3A3F4D}
button:focus-visible{outline:2px solid var(--silver);outline-offset:1px}
button.run{background:linear-gradient(135deg,#F0284F,#A31238);border:0;box-shadow:0 2px 14px rgba(255,77,109,.28)}
#st::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--silver);margin-right:6px}
.row.on{background:linear-gradient(90deg,var(--accent-overlay),transparent)}
.tab.on{border-bottom-color:var(--accent-bright)}

#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);text-align:center;background:radial-gradient(120% 90% at 50% 0%,#2A0B15 0%,#08090C 64%);transition:opacity .5s}

#splash.ready #bar i{animation:none;width:100%}
#ex{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:560px}

<script>
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const MB='https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/';
const LANG={py:'python',js:'javascript',html:'html',css:'css',json:'json',md:'markdown'};
const SEED={
'hello.py':"name = 'Weaver'\nprint(f'Hello from {name}')\nx = 21\nx * 2\n",
'plot.py':"import numpy as np\nimport matplotlib.pyplot as plt\nx = np.linspace(0, 10, 500)\nplt.plot(x, np.sin(x))\nplt.title('sin(x)')\nplt.show()\n",
'data.py':"import pandas as pd\ndf = pd.DataFrame({'n': range(1, 6), 'square': [i*i for i in range(1, 6)]})\ndf\n",
'index.html':"<h1>Hello, web</h1>\n<button id=\"b\">Tap me</button>\n<link rel=\"stylesheet\" href=\"style.css\">\n<script src=\"script.js\"><\/script>\n",
'style.css':"body{font-family:system-ui;background:#111;color:#eee;padding:2rem}\nbutton{padding:.6rem 1rem}\n",
'script.js':"let n=0;\nb.onclick=()=>{b.textContent='Taps: '+(++n);console.log('tap',n)};\n"};
/* IndexedDB key-value store: survives reloads and cache updates */
const idb=new Promise((ok,no)=>{const q=indexedDB.open('pystudio',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const kv=(m,k,v)=>idb.then(d=>new Promise((ok,no)=>{const s=d.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv'),r=m==='get'?s.get(k):s.put(v,k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
/* Pyodide runs in a Web Worker so the UI never freezes. Stop = terminate worker. */
function pyWorker(){
 const IDX='https://cdn.jsdelivr.net/pyodide/v0.27.2/full/';
 importScripts(IDX+'pyodide.js');
 const post=(t,d)=>postMessage({t,d});
 const R=(async()=>{const p=await loadPyodide({indexURL:IDX});p.setStdout({batched:s=>post('out',s)});p.setStderr({batched:s=>post('err',s)});post('ready');return p})();
 const SNIP="import sys,io,base64\no=[]\nif 'matplotlib.pyplot' in sys.modules:\n    import matplotlib.pyplot as plt\n    for n in plt.get_fignums():\n        b=io.BytesIO();plt.figure(n).savefig(b,format='png',dpi=110,bbox_inches='tight');o.append(base64.b64encode(b.getvalue()).decode())\n    plt.close('all')\no";
 const MPL="import matplotlib\nmatplotlib.use('agg')\nimport matplotlib.pyplot as plt\nplt.style.use('dark_background')\nplt.rcParams.update({'figure.facecolor':'#101217','axes.facecolor':'#101217','savefig.facecolor':'#101217','axes.prop_cycle':plt.cycler(color=['#FF4D6D','#C9CCD6','#E6B566','#7EE0C3'])})\nplt.show=lambda *a,**k:None";
 let Q=Promise.resolve();onmessage=({data})=>{Q=Q.then(()=>H(data))};const H=async data=>{let t;
  try{const py=await R;t=performance.now();
   if(data.pkgs){await py.loadPackage('micropip');const mp=py.pyimport('micropip');
   for(const n of data.pkgs){try{await mp.install(n);post('pk',n);if(data.manual)post('out','installed '+n)}catch(e){post('err',n+': '+String(e.message||e).trim().split('\n').pop())}}
   post('pkdone',!!data.manual);return}
   await py.loadPackagesFromImports(data.code);
   if(data.code.includes('matplotlib'))await py.runPythonAsync(MPL);
   const r=await py.runPythonAsync(data.code);
   if(r!==undefined&&r!==null){const h=typeof r==='object'&&r._repr_html_;post(h?'html':'out',h?r._repr_html_():String(r));if(r.destroy)r.destroy()}
   const im=py.runPython(SNIP);im.toJs().forEach(i=>post('img',i));im.destroy()}
  catch(e){post('err',String(e.message||e))}
  post('done',t?Math.round(performance.now()-t):0)}
}
const W='('+pyWorker+')()';
let w=null,busy=false,models={},O=[],cur=null,D=new Set(),tm,ed,fs=14;
const st=s=>$('st').textContent=s;
function log(s,c){const d=el('div',c||'',s);$('outp').append(d);$('outp').scrollTop=1e9}
function boot(){st('PY loading...');w=new Worker(URL.createObjectURL(new Blob([W],{type:'text/javascript'})));if(PK.length){log('Restoring packages: '+PK.join(', '),'m');w.postMessage({pkgs:PK})}
 w.onerror=e=>{log('Python runtime failed to load: '+(e.message||'check your connection (first run needs internet).'),'e');busy=false;$('stop').hidden=true;w=null;st('PY error')};
 w.onmessage=({data:{t,d}})=>{
  if(t==='ready')st('PY ready');
  else if(t==='out')log(d);else if(t==='err')log(d,'e');
  else if(t==='html'){const f=el('iframe');f.setAttribute('sandbox','');f.srcdoc='<style>body{margin:6px;background:#101217;color:#E8E9ED;font:12px ui-monospace,monospace}table{border-collapse:collapse}td,th{border:1px solid #252831;padding:2px 8px;text-align:right}</style>'+d;$('outp').append(f)}
  else if(t==='img'){const i=el('img');i.src='data:image/png;base64,'+d;$('outp').append(i)}
  else if(t==='pk'){if(!PK.includes(d)){PK.push(d);save()}}else if(t==='pkdone'){if(d){busy=false;$('stop').hidden=true}if(!busy)st('PY ready')}else if(t==='done'){busy=false;$('stop').hidden=true;st('PY ready - '+d+' ms')}}}
/* views */
function tab(n){$('outp').hidden=n!==1;$('prev').hidden=n!==2;$('t1').classList.toggle('on',n===1);$('t2').classList.toggle('on',n===2)}
function setV(v){document.querySelector('main').dataset.view=v;$('view').textContent=v==='out'?'Code':'Output'}
const side=on=>document.body.classList.toggle('side',on);
/* files + tabs */
function addF(n,txt){const m=monaco.editor.createModel(txt,LANG[n.split('.').pop().toLowerCase()]||'plaintext');m.onDidChangeContent(()=>dirty(n));models[n]=m}
function list(){$('files').replaceChildren(...Object.keys(models).sort().map(n=>{const r=el('div','row'+(n===cur?' on':'')),a=el('span','fn',n),m=el('button','mini','...'),x=el('button','mini','x');a.onclick=()=>openF(n);m.onclick=()=>ren(n);x.onclick=()=>del(n);r.append(a,m,x);return r}))}
function renderTabs(){$('tabs').replaceChildren(...O.map(n=>{const b=el('button','tab'+(n===cur?' on':''),n+(D.has(n)?' *':''));b.onclick=()=>openF(n);return b}))}
function openF(n){if(!O.includes(n))O.push(n);cur=n;ed.setModel(models[n]);renderTabs();list();setV('code');side(false)}
const okName=n=>/^[\w.\- ]+$/.test(n)&&!models[n];
function del(n){if(!confirm('Delete '+n+'? This cannot be undone.'))return;models[n].dispose();delete models[n];O=O.filter(x=>x!==n);cur=models[cur]?cur:(O[0]||Object.keys(models)[0]);cur?openF(cur):(ed.setModel(null),renderTabs(),list());save()}
function ren(n){const m=(prompt('Rename to',n)||'').trim();if(!m||m===n)return;if(!okName(m))return alert('Invalid or existing name.');const t=models[n].getValue();models[n].dispose();delete models[n];addF(m,t);O=O.map(x=>x===n?m:x);if(cur===n)cur=m;openF(cur);save()}
function dirty(n){D.add(n);renderTabs();clearTimeout(tm);tm=setTimeout(save,600)}
async function save(){clearTimeout(tm);const o={};for(const n in models)o[n]=models[n].getValue();await kv('put','files',o);await kv('put','ui',{O,cur,fs,v:2,PK});D.clear();renderTabs();usage()}
async function usage(){const e=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():null;$('foot').textContent=(navigator.onLine?'online':'offline')+(e?' - '+(e.usage/1048576).toFixed(1)+' MB used':'')}
/* run: .py -> Pyodide, anything else -> sandboxed web preview */
function run(){const f=cur;if(!f)return;save();
 if(/\.py$/i.test(f)){if(busy)return;if(!w)boot();busy=true;$('stop').hidden=false;tab(1);setV('out');log('>>> '+f,'m');st('PY running...');w.postMessage({code:models[f].getValue()})}
 else{preview();tab(2);setV('out')}}
async function preview(){
 const cr=/\.(p5|three)\.js$/i.exec(cur||'');
 let h=cr?await creative(cr[1]):(models['index.html']?models['index.html'].getValue():'<p>Add an index.html to preview.</p>');
 h=h.replace(/<link[^>]+href=["']([^"']+\.css)["'][^>]*>/g,(m,n)=>models[n]?'<style>'+models[n].getValue()+'</style>':m);
 h=h.replace(/<script[^>]+src=["']([^"']+\.js)["'][^>]*>\s*<\/script>/g,(m,n)=>models[n]?'<script>'+models[n].getValue().replace(/<\/script/gi,'<\\/script')+'<\/script>':m);
 const hook='<script>for(const k of["log","warn","error"]){const o=console[k];console[k]=(...a)=>{parent.postMessage({c:k,m:a.map(String).join(" ")},"*");o.apply(console,a)}}onerror=m=>parent.postMessage({c:"error",m:String(m)},"*")<\/script>';
 $('wc').textContent='';$('pf').srcdoc='<!doctype html>'+hook+h}
addEventListener('message',e=>{if(e.source!==$('pf').contentWindow||!e.data||typeof e.data.m!=='string')return;const c=$('wc');c.append(document.createTextNode('['+e.data.c+'] '+e.data.m+'\n'));c.scrollTop=1e9});
/* controls */
$('run').onclick=run;$('menu').onclick=()=>side();
$('view').onclick=()=>setV(document.querySelector('main').dataset.view==='out'?'code':'out');
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>{preview();tab(2)};
$('clr').onclick=()=>{$('outp').replaceChildren();$('wc').textContent=''};
$('stop').onclick=()=>{if(w)w.terminate();w=null;busy=false;$('stop').hidden=true;st('PY idle');log('Interrupted. The interpreter restarts on the next run (variables cleared).','e')};
$('nf').onclick=()=>{const n=(prompt('New file name (e.g. app.py)')||'').trim();if(!n)return;if(!okName(n))return alert('Invalid or existing name.');addF(n,'');openF(n);save()};
$('dl').onclick=()=>{if(!cur)return;const a=el('a');a.href=URL.createObjectURL(new Blob([models[cur].getValue()]));a.download=cur;a.click()};
const fsz=d=>{fs=Math.min(28,Math.max(10,fs+d));ed.updateOptions({fontSize:fs});save()};
$('fm').onclick=()=>fsz(-1);$('fp').onclick=()=>fsz(1);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ed)save()});
addEventListener('online',usage);addEventListener('offline',usage);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js'));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
/* Monaco editor (loaded from CDN, cached by the service worker for offline use) */
require.config({paths:{vs:MB+'vs'}});
window.MonacoEnvironment={getWorkerUrl:()=>URL.createObjectURL(new Blob(["self.MonacoEnvironment={baseUrl:'"+MB+"'};importScripts('"+MB+"vs/base/worker/workerMain.js');"],{type:'text/javascript'}))};
require(['vs/editor/editor.main'],async()=>{
 monaco.editor.defineTheme('ps',{base:'vs-dark',inherit:true,rules:[{token:'keyword',foreground:'FF5C77'},{token:'string',foreground:'E3C07B'},{token:'comment',foreground:'606571',fontStyle:'italic'},{token:'number',foreground:'F2A07B'},{token:'tag',foreground:'FF5C77'},{token:'attribute.name',foreground:'C9CCD6'},{token:'attribute.value',foreground:'E3C07B'}],colors:{'editor.background':'#08090C','editorLineNumber.foreground':'#4A4F5C','editorLineNumber.activeForeground':'#9296A1','editor.lineHighlightBackground':'#0D0F13','editorCursor.foreground':'#FF4D6D','editor.selectionBackground':'#E11D4840','editorIndentGuide.background1':'#1B1E25'}});

 let files=await kv('get','files'),ui=(await kv('get','ui'))||{};let seeded=!files;if(!files)files=SEED;if((ui.v||1)<2){for(const n in SEED2)if(!(n in files))files[n]=SEED2[n];seeded=true}const hold=seeded;

const LIBS={p5:'https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js',three:'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'},LC={},esc=t=>t.replace(/<\/script/gi,'<\\/script');
async function creative(k){try{const u=LIBS[k.toLowerCase()],lib=LC[u]||(LC[u]=await(await fetch(u)).text());

function runCell(){if(!cur||!/\.py$/i.test(cur))return run();if(busy)return;
 const L=models[cur].getLinesContent(),ln=ed.getPosition().lineNumber-1;let a=0,b=L.length;

/* notebook interchange: "# %%" percent cells <-> .ipynb JSON */
function toNb(t){const cells=[];let c=null;const mk=md=>{c={cell_type:md?'markdown':'code',metadata:{},source:[]};if(!md){c.outputs=[];c.execution_count=null}cells.push(c)};
 for(const l of t.split('\n')){const m=/^# %%(\s*\[markdown\])?/.exec(l);if(m)mk(!!m[1]);else{if(!c)mk(false);c.source.push(c.cell_type==='markdown'?l.replace(/^# ?/,''):l)}}
 for(const k of cells){while(k.source.length&&!k.source[k.source.length-1].trim())k.source.pop();k.source=k.source.map((x,i)=>i<k.source.length-1?x+'\n':x)}
 return JSON.stringify({cells,metadata:{kernelspec:{name:'python3',display_name:'Python 3',language:'python'},language_info:{name:'python'}},nbformat:4,nbformat_minor:4},null,1)}
function fromNb(j){const o=JSON.parse(j);if(!o||!Array.isArray(o.cells))throw Error('not a valid notebook');
 return o.cells.map(k=>{const s=Array.isArray(k.source)?k.source.join(''):String(k.source||'');return k.cell_type==='markdown'?'# %% [markdown]\n'+s.split('\n').map(x=>'# '+x).join('\n'):k.cell_type==='code'?'# %%\n'+s:null}).filter(x=>x!==null).join('\n\n')+'\n'}

const jz=()=>window.JSZip?Promise.resolve(JSZip):new Promise((ok,no)=>{const s=el('script');s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';s.onload=()=>ok(JSZip);s.onerror=()=>no(Error('JSZip failed to load (internet needed the first time)'));document.head.append(s)});
const down=(b,n)=>{const a=el('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4e3)};
const safe=p=>{if(/(^|[\\/])\.\.([\\/]|$)|^[\\/]/.test(p))return null;const n=p.split('/').pop();return /^[\w.\- ]+$/.test(n)&&n[0]!=='.'?n:null},TXT=/\.(py|js|html|css|json|txt|md|csv|svg)$/i;
function put(n,t){let k=n,i=1;while(models[k])k=n.replace(/(\.[^.]*)?$/,'-'+(i++)+'$1');addF(k,t)}

$('zp').onclick=async()=>{try{const Z=await jz(),z=new Z();for(const n in models)z.file(n,models[n].getValue());down(await z.generateAsync({type:'blob'}),'weaver-project.zip')}catch(e){alert(e.message)}};

 if(/\.zip$/i.test(f.name)){const z=await(await jz()).loadAsync(f);for(const p in z.files){if(z.files[p].dir)continue;const n=safe(p);if(n&&TXT.test(n))put(n,await z.files[p].async('string'))}}
 else if(/\.ipynb$/i.test(f.name))put(f.name.replace(/\.ipynb$/i,'.py'),fromNb(await f.text()));
 else{const n=safe(f.name);if(n&&TXT.test(n))put(n,await f.text());else throw Error('unsupported file type')}
 }catch(x){alert(f.name+': '+x.message)}}e.target.value='';list();save()};
